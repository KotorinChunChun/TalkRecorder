[package]
name = "talkrecorder-reuse-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "talkrecorder_reuse"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "=1.0.104"
libloading = "=0.8.9"
serde_json = "=1.0.154"

[workspace]

[profile.release]
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
