[package]
name = "talkrecorder-deepfilter-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
exclude = ["vendor/libDF"]

[lib]
name = "talkrecorder_deepfilter"
crate-type = ["cdylib", "rlib"]

[dependencies]
deep_filter = { path = "vendor/libDF", default-features = false, features = ["tract"] }
serde_json = "1"
# tract一式を揃え、上流との差分はvendor/README.mdに記録する。
tract-core = "=0.21.17"
tract-data = "=0.21.17"
tract-hir = "=0.21.17"
tract-linalg = "=0.21.17"
tract-nnef = "=0.21.17"
tract-onnx = "=0.21.17"
tract-onnx-opl = "=0.21.17"
tract-pulse = "=0.21.17"
tract-pulse-opl = "=0.21.17"

[dev-dependencies]
hound = "=3.5.1"
libloading = "0.8"

[profile.release]
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
