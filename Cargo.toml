[package]
name = "talk-recorder"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
default-run = "TalkRecorder"
description = "Windows conversation recorder with synchronized device tracks"

[[bin]]
name = "TalkRecorder"
path = "src/main.rs"

[[bin]]
name = "TalkRecorder-cli"
path = "src/cli_main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
libloading = "0.8"
raw-window-handle = "=0.6.2"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "=0.24.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Power", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
